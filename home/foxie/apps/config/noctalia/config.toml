[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.4999999888241291
contact_shadow = true
end = [ "media", "tray", "group:g2", "group:g1", "group:g3" ]
font_family = "Maple Mono NF CN"
margin_edge = 5
margin_ends = 16
padding = 10
radius = 16
start = [ "workspaces", "active_window" ]
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "notifications", "session" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[brightness]
minimum_brightness = 0.0099999997764825821

[dock]
background_opacity = 0.4999999888241291
enabled = true
icon_size = 64
launcher_position = "start"
margin_edge = 5
radius = 48
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
transition = [ "disc", "honeycomb", "stripes" ]
transition_duration = 1000

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "tertiary"
font_family = "Maple Mono NF CN"

    [shell.animation]
    speed = 2.0000000298023224

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = false

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "destructive"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [shell.shadow]
    direction = "center"

[theme]
custom_palette = "pd-image1-fs"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "starship" ]

[wallpaper]
directory = "/home/foxie/Pictures/Wallpapers"
transition = [ "disc", "honeycomb", "stripes", "wipe" ]

    [wallpaper.automation]
    enabled = true
    recursive = true

    [wallpaper.default]
    path = "/home/foxie/Pictures/Wallpapers/pd-image1.png"

    [wallpaper.last]
    path = "/home/foxie/Pictures/Wallpapers/pd-image1.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/foxie/Pictures/Wallpapers/pd-image1.png"
